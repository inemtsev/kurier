# The full quality gate: compile, tests, ktlint, detekt, and the binary-compatibility check —
# all wired into `check`, so one `build` invocation is the entire pipeline (matches CLAUDE.md's
# "run before declaring any change done"). No tokens: all tests run against in-memory fakes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build (compile + tests + ktlint + detekt + apiCheck)
        run: ./gradlew build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
